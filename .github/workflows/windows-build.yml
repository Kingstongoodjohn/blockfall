# Builds Blockfall with Microsoft's compiler (MSVC) on a Windows machine, runs the tests, signs the
# exe when code signing is set up (Azure Artifact Signing), and commits it to bin/Blockfall.exe.
#
# Why: antivirus "guess" checks flag small unknown exes built with MinGW more often than MSVC ones,
# and only a signed exe gets rid of SmartScreen / Smart App Control warnings for good.
#
# Signing turns itself on once these repository secrets exist (Settings -> Secrets and variables
# -> Actions): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, SIGNING_ENDPOINT,
# SIGNING_ACCOUNT, SIGNING_PROFILE. See docs/code-signing.md.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC, x64)
        run: cmake -S . -B build -A x64 -DBLOCKFALL_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: build\Release\blockfall_tests.exe

      - name: Sign with Azure Artifact Signing
        if: env.CAN_SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Commit bin/Blockfall.exe
        shell: bash
        run: |
          cp build/Release/Blockfall.exe bin/Blockfall.exe
          git config user.name "blockfall-build"
          git config user.email "blockfall-build@users.noreply.github.com"
          git add bin/Blockfall.exe
          if git diff --cached --quiet; then echo "exe unchanged"; exit 0; fi
          if [ "$CAN_SIGN" = "true" ]; then KIND="signed MSVC build"; else KIND="MSVC build (unsigned)"; fi
          git commit -m "bin: $KIND of ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
